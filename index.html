.fig { margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }

.h4 { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); }
.h3 { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.h2 { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.h1 { background: var(--surface); color: var(--muted); }
.note { font-size: .85rem; color: var(--muted); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.steps div { border-top: 2px solid var(--accent); padding-top: 6px; font-size: .88rem; }
.steps b { display: block; font-family: var(--mono); font-weight: 500; color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { nav.tabs a, .weeknav a { transition: background .15s, color .15s; } }

        [20.5, 2023, "AI for hip fracture detection and outcome prediction", 36930153, "Detection and prediction in one condition", ""],

        ["0.5/mo", 2024, "AI-guided assessment of femoral neck fractures", 39334556, "Recent meta-analysis", ""],
      ]],
      ["Osteoarthritis and arthroplasty", [
        [13.5, 2025, "Deep learning X-ray for knee osteoarthritis grading", 38997539, "Second major imaging use", ""],
        ["0.5/mo", 2025, "AI and machine learning in knee arthroplasty", 40022960, "Planning and outcome prediction", ""],
      ]],
      ["Spine", [
        ["2.0/mo", 2026, "Risk prediction in spine surgery, traditional models and AI", 41973342, "Beyond imaging, fastest rising MSK review", "W12"],
        ["2.0/mo", 2026, "Digital twins and multimodal AI in spine care", 42101555, "Multimodal models", ""],
      ]],
      ["Overview, language models and movement", [
        [16.1, 2020, "AI and orthopaedics, an introduction for clinicians", 32379124, "Shared vocabulary", "W9"],
        [10.5, 2024, "Comprehensive review of deep learning in orthopaedics", 39079201, "Broad deep learning overview", ""],
        [12.2, 2023, "ChatGPT in orthopaedics, narrative review", 38026475, "Only language-model entry, weakest design", ""],
        [6.6, 2001, "Analytical techniques for gait data, neural network methods", 11240358, "Early AI for movement data", ""],
      ]],
    ],
  },
};

const HEAT = {
  cols: ["Image models", "Tabular risk models", "Language models", "Signal models"],
  rows: [
    ["Radiology", 40, 1, 36, 0], ["Pathology", 27, 0, 10, 0], ["Dermatology", 5, 1, 3, 0],
    ["Ophthalmology", 18, 0, 17, 0], ["Cardiology", 2, 1, 8, 1], ["Oncology", 21, 6, 12, 0],
    ["Orthopaedics / MSK", 16, 5, 13, 0], ["Psychiatry", 10, 3, 9, 1],
  ],
};

let liveQs = {};
let liveAns = {};
let liveLinks = {};
let liveFigs = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function home() {
  const months = [
    [1, "Adoption", "What blocks AI from being used, and what helps"],
    [2, "Model types and specialties", "Why different kinds of AI suit different specialties"],
    [3, "Musculoskeletal care", "Which AI is used for which MSK condition"],
  ];
  return `
  <section>
    <span class="eyebrow">Weekly AI discussion · three months, twelve sessions</span>
    <h1>AI adoption in healthcare</h1>
    <p class="lede">This is a weekly AI discussion, run as a journal club. AI tools are being built faster than hospitals can adopt them. This journal club asks why, and what that means for musculoskeletal care.</p>
  </section>
  <section>
    <h2>Three focuses</h2>
    <div class="focus-grid">
      ${months.map(([m, t, d], i) => `<a class="focus" href="#${["adoption", "models", "msk"][i]}"><span class="month">Month ${m}</span><h3>${["①", "②", "③"][i]} ${t}</h3><p>${d}</p></a>`).join("")}
    </div>
    <p>We start with adoption so everyone shares the same vocabulary of barriers and facilitators. Every later paper is then read through that lens. Each month mixes reviews, for the big picture, with at least one primary study, to check a review against real evidence.</p>
  </section>
  <section>
    <h2>Each session, 60 minutes</h2>
    <div class="steps">
      <div><b>0–5</b>Why this paper</div>
      <div><b>5–15</b>What they did</div>
      <div><b>15–35</b>Appraisal</div>
      <div><b>35–50</b>So what for us</div>
      <div><b>50–60</b>One take-home each</div>
    </div>
    <p class="note">Questions go up before each session. Answers appear on the week's page after we have discussed them.</p>
  </section>
  <section>
    <h2>Programme</h2>
    <p class="note">Dates to be confirmed.</p>
    <div class="timeline">
      ${[1, 2, 3].map(m => `<div class="eyebrow monthhead">Month ${m}</div>` + WEEKS.filter(x => x.month === m).map(x => `
        <a href="#w${x.w}"><span class="wk">W${x.w}</span><span class="ttl">${esc(x.title)}<br><span class="ty">${esc(x.type)} · ${esc(x.cite)}</span></span>${hasQs(x.w) ? '<span class="chip ready">Questions up</span>' : '<span class="chip">Coming</span>'}</a>`).join("")).join("")}
    </div>
  </section>`;
}

function hasQs(w) { return (liveQs[w] && liveQs[w].length) || STATIC_QS[w]; }

function paperTable(rows) {
  return `<div class="tablebox"><table>
    <thead><tr><th>RCR</th><th>Year</th><th>Paper</th><th>Why it matters</th><th>Read</th></tr></thead>
    <tbody>${rows.map(([r, y, t, pm, why, wk]) => `<tr><td class="num">${r}</td><td class="num">${y}</td><td><a href="${PM(pm)}" target="_blank" rel="noopener">${esc(t)}</a></td><td>${esc(why)}</td><td>${wk ? `<a class="pick" href="#${wk.toLowerCase()}">★ ${wk}</a>` : ""}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

function heat() {
  const cls = n => n >= 30 ? "h4" : n >= 15 ? "h3" : n >= 5 ? "h2" : "h1";
  return `<section><h2>How crowded is each pairing?</h2>
  <p class="note">Number of reviews per specialty and model type, PubMed 2017–2024, title search, so counts are lower bounds.</p>
  <div class="tablebox"><table class="heat"><thead><tr><th>Specialty</th>${HEAT.cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
  <tbody>${HEAT.rows.map(([s, ...v]) => `<tr><td>${s}</td>${v.map(n => `<td class="c ${cls(n)}">${n}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
}

function focus(key) {
  const f = FOCUS[key];
  return `<section><span class="eyebrow">${f.month}</span><h1>${f.n} ${f.title}</h1><p class="lede">${f.intro}</p></section>
  ${f.heat ? heat() : ""}
  ${f.blocks.map(([h, rows]) => `<section><h2>${h}</h2>${paperTable(rows)}</section>`).join("")}
  <p class="note">Figures ending in /mo are citations per month since publication, used where papers are too new for a stable RCR.</p>`;
}

function sessionLinks(w) {
  const L = liveLinks[w] || {};
  const safe = u => typeof u === "string" && /^https:\/\//.test(u) ? u : "";
  const card = (when, title, desc, url, label) => `<div><span class="when">${when}</span><h3>${title}</h3><p>${desc}</p>${safe(url) ? `<a class="go" href="${esc(safe(url))}" target="_blank" rel="noopener">${label} →</a>` : `<span class="soon">Link coming soon</span>`}</div>`;
  return `<section><h2>This session</h2><div class="sess">
    ${card("Before", "Pre-session check-in", "Tells us what you already know and think about this week's topic, so we can pitch the discussion. It also works as the sign-in sheet.", L.pre, "Open the check-in")}
    ${card("During", "Discussion doc", "The 30-minute running order, the learnings table, breakout prompts and main-room questions. Everyone edits it during the session.", L.notes, "Open the discussion doc")}
    ${card("After", "Session review", "Rate the session and leave any feedback, so we keep a record and improve the next one.", L.post, "Open the review")}
  </div></section>`;
}

function week(w) {
  const x = WEEKS.find(k => k.w === w);
  const groups = liveQs[w] && liveQs[w].length ? liveQs[w] : STATIC_QS[w];
  let qn = 0;
  const qs = groups
    ? groups.map(([g, list]) => `<div class="qgroup">${esc(g)}</div><ol class="qs" start="${qn + 1}">${list.map(q => { qn++; return `<li>${esc(q)}</li>`; }).join("")}</ol>`).join("")
    : `<p class="note">Questions go up the week before this session.</p>`;
  const ans = liveAns[w];
  const block = (title, items) => items.length ? `<h3>${title}</h3><ul class="postlist">${items.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : "";
  const answers = ans
    ? `<div class="answers open"><span class="state">Released after the session</span>
        ${ans.summary ? `<p>${esc(ans.summary)}</p>` : ""}
        ${ans.answers.length ? `<h3>Answers to the discussion questions</h3><ol class="postlist">${ans.answers.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
        ${block("Feedback highlights", ans.highlights)}
        ${block("Take-home messages", ans.takehomes)}
      </div>`
    : `<div class="answers"><span class="state">Locked until after the session</span><p class="note">Answers, feedback highlights and the group's take-home messages appear here after we have discussed the paper.</p></div>`;
  const figs = (liveFigs[w] || []).filter(f => /^assets\/figures\/[\w.-]+$/.test(f.src || ""));
  const hero = figs[0];
  const full = x.alt || x.url;
  const box = `<div class="box">
      <span class="kicker">Week ${w} · Month ${x.month} · ${esc(x.type)}</span>
      <h1>${esc(x.title)}</h1>
      <span class="kicker">${esc(x.cite)}</span>
      <hr>
      <div class="ft"><a href="${esc(full)}" target="_blank" rel="noopener">Full text →</a>${x.alt ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">Publisher page →</a>` : ""}${figs.length > 1 ? `<div class="dots" role="group" aria-label="Choose image">${figs.map((f, i) => `<button type="button" aria-label="Show image ${i + 1} of ${figs.length}" aria-current="${i === 0}" data-i="${i}"></button>`).join("")}</div>` : ""}</div>
    </div>`;
  const heroHtml = hero
    ? `<section class="hero" aria-roledescription="carousel" aria-label="Figures from this paper"><div class="frame"><div class="slides">${figs.map((f, i) => `<figure class="slide${i === 0 ? " on" : ""}" aria-hidden="${i === 0 ? "false" : "true"}"><img src="${esc(f.src)}" alt="${esc(f.alt || "")}"></figure>`).join("")}</div></div>${box}</section>`
    : `<section class="hero noimg">${box}</section>`;
  const more = "";
  return `${heroHtml}
  <section class="band"><span class="lbl">Why we read it</span><p>${esc(x.why)}</p></section>
  ${hero ? `<p class="credit-line">Images: ${figs.map(f => `${esc(f.caption || "")} ${esc(f.credit || "")}`).join(" · ")}</p>` : ""}
  <div class="wrap stack">
  <nav class="weeknav" aria-label="Weeks">${WEEKS.map(k => `<a href="#w${k.w}" ${k.w === w ? 'aria-current="page"' : ""}>W${k.w}</a>`).join("")}</nav>
  ${more}
  ${sessionLinks(w)}
  <section><h2>Discussion questions</h2>${qs}</section>
  <section><h2>After the session</h2>${answers}</section>
  </div>`;
}

let carouselTimer = null;
function startCarousel() {
  clearInterval(carouselTimer);
  const hero = document.querySelector(".hero");
  if (!hero || !hero.querySelector(".slides")) return;
  const slides = [...hero.querySelectorAll(".slide")];
  const dots = [...hero.querySelectorAll(".dots button")];
  if (slides.length < 2) return;
  let i = 0;
  const show = n => {
    i = (n + slides.length) % slides.length;
    slides.forEach((s, k) => { s.classList.toggle("on", k === i); s.setAttribute("aria-hidden", String(k !== i)); });
    dots.forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
  };
  const auto = () => {
    clearInterval(carouselTimer);
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      carouselTimer = setInterval(() => show(i + 1), 6000);
    }
  };
  dots.forEach(d => d.addEventListener("click", () => { show(+d.dataset.i); auto(); }));
  hero.addEventListener("mouseenter", () => clearInterval(carouselTimer));
  hero.addEventListener("mouseleave", auto);
  auto();
}

function render() {
  const h = (location.hash || "#home").slice(1);
  let tab = "home", html;
  const m = h.match(/^w(\d{1,2})$/);
  if (m && WEEKS.some(k => k.w === +m[1])) { tab = "week"; html = week(+m[1]); }
  else if (FOCUS[h]) { tab = h; html = `<div class="wrap stack">${focus(h)}</div>`; }
  else html = `<div class="wrap stack">${home()}</div>`;
  document.getElementById("view").innerHTML = html;
  startCarousel();
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.tab === tab) {
      a.setAttribute("aria-current", "page");
    } else {
      a.removeAttribute("aria-current");
    }
  });
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();

(async () => {
  const load = async f => { try { const r = await fetch(f, { cache: "no-cache" }); return r.ok ? await r.json() : {}; } catch { return {}; } };
  const [q, a, l] = await Promise.all([load("data/questions.json"), load("data/answers.json"), load("data/links.json")]);
  const figs = await load("data/figures.json");
  for (const [k, v] of Object.entries(figs)) { const n = +k.replace(/^w/, ""); if (n && Array.isArray(v)) liveFigs[n] = v; }
  for (const [k, v] of Object.entries(l)) { const n = +k.replace(/^w/, ""); if (n && v && typeof v === "object") liveLinks[n] = v; }
  for (const [k, v] of Object.entries(q)) { const n = +k.replace(/^w/, ""); if (n && Array.isArray(v)) liveQs[n] = v.map(g => [g.label || "", Array.isArray(g.items) ? g.items : []]); }
  for (const [k, v] of Object.entries(a)) {
    const n = +k.replace(/^w/, "");
    if (!n || !v) continue;
    const post = Array.isArray(v) ? { answers: v } : v;
    const list = x => (Array.isArray(x) ? x.map(String) : []);
    const entry = { answers: list(post.answers), highlights: list(post.highlights), takehomes: list(post.takehomes), summary: typeof post.summary === "string" ? post.summary : "" };
    if (entry.answers.length || entry.highlights.length || entry.takehomes.length || entry.summary) liveAns[n] = entry;
  }
  render();
})();
</script>
